name: Build Maloja ROM (Y1 type A)

# Builds this branch's launcher (Maloja scrobbling) into a flashable Y1 type A ROM.
# Branch-only on purpose: build-roms.yml rebuilds every upstream release on master.
on:
  push:
    branches: ["maloja-scrobble"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        # debug build: the release config has no keystore, and a system app only needs to be signed by something
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug

      - name: Build ROM
        run: |
          APK="$PWD/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p dist  # absolute output path: the script cds into its work dir before zipping
          ./scripts/build-rom.sh a --launcher-apk-url "file://$APK" "$PWD/dist/rom.zip"

      - uses: actions/upload-artifact@v4
        with:  # for quick installs over ADB (root) without a reflash
          name: apk-maloja
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: rom-maloja-type-a
          path: dist/rom.zip
          retention-days: 14
